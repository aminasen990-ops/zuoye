        { word: "过", emoji: "✔️", pinyin: "guò", translation: "бывал когда-то / переходить / отмечать", category: "grammar", comments: "👉 Оригинальное значение — «переходить»: 过马路\n👉 Значение 1: 过 + праздник = отмечать: 过生日\n👉 Значение 2: V + 过 — было уже такое: 去过了七个国家, 吃过了中国菜", grammar: "опыт в прошлом" },
        { word: "也", emoji: "⚪", pinyin: "yě", translation: "тоже", category: "grammar", comments: "⚠️ Не употребляется без глагола\n❌ 我也\n✔️ 我也去\n✔️ 我也有书\n✔️ 我也是", grammar: "" },
        { word: "时候 vs 时间", emoji: "🕐", pinyin: "shí hou / shí jiān", translation: "момент vs длительность", category: "grammar", comments: "❓ 你什么时候睡觉？ — когда? (момент, в ответе: 点, 分)\n❓ 你睡觉多长时间？ — сколько времени? (длительность, в ответе: 小时, 分钟)", grammar: "важное различие" }
    ];

    const categoryColors = { time: "#d4a017", action: "#c75c3a", people: "#4f8a5e", places: "#8f6ca3", food: "#e67e22", question: "#3987c4", evaluation: "#b88b4a", phrase: "#4f9e9e", grammar: "#aa9f7c" };
    const categoryNames = { time: "🟡 Время", action: "🔴 Действия", people: "🟢 Люди", places: "🟣 Места", food: "🟠 Еда", question: "💙 Вопросы", evaluation: "🟤 Оценка", phrase: "💬 Фразы", grammar: "🧩 Грамматика" };

    let currentCategory = "all", searchQuery = "", globalPinyinVisible = false, globalTransVisible = false, currentModalData = null, modalPinyinVisible = false, modalTransVisible = false;

    function getFilteredWords() { return vocabulary.filter(item => { if (currentCategory !== "all" && item.category !== currentCategory) return false; if (searchQuery.trim()) { const q = searchQuery.trim().toLowerCase(); return item.word.toLowerCase().includes(q) || item.pinyin.toLowerCase().includes(q) || item.translation.toLowerCase().includes(q) || (item.comments && item.comments.toLowerCase().includes(q)) || (item.grammar && item.grammar.toLowerCase().includes(q)); } return true; }); }
    function renderBalls() { const filtered = getFilteredWords(); const grid = document.getElementById("cardsGrid"); const noMsg = document.getElementById("noResultsMsg"); if (filtered.length === 0) { grid.innerHTML = ""; noMsg.style.display = "block"; return; } noMsg.style.display = "none"; grid.innerHTML = filtered.map(item => { const bgColor = categoryColors[item.category] || "#99946e"; return `<div class="word-ball" style="background: radial-gradient(circle at 30% 30%, ${bgColor}cc, ${bgColor});" data-word='${JSON.stringify(item)}'><div class="ball-emoji">${item.emoji || "🔖"}</div><div class="ball-chinese">${item.word.length > 10 ? item.word.slice(0,10) : item.word}</div></div>`; }).join(''); document.querySelectorAll('.word-ball').forEach(el => { el.addEventListener('click', () => { const raw = el.getAttribute('data-word'); if (raw) openModal(JSON.parse(raw)); }); }); }
    function openModal(wordObj) { currentModalData = wordObj; modalPinyinVisible = globalPinyinVisible; modalTransVisible = globalTransVisible; updateModalContent(); document.getElementById("wordModal").classList.add("active"); }
    function updateModalContent() { if (!currentModalData) return; const pinyinHtml = modalPinyinVisible ? `<div class="pinyin-area">🔊 ${currentModalData.pinyin}</div>` : `<div class="pinyin-area" style="filter: blur(4px); cursor: pointer;" onclick="window.toggleModalPinyin()">🔒 пиньинь скрыт (нажмите кнопку)</div>`; const transHtml = modalTransVisible ? `<div class="trans-area">🌍 ${currentModalData.translation}</div>` : `<div class="trans-area" style="filter: blur(4px); cursor: pointer;" onclick="window.toggleModalTrans()">🔒 перевод скрыт (нажмите кнопку)</div>`; const commentsHtml = currentModalData.comments ? `<div class="comment-area">💬 ${currentModalData.comments}</div>` : ""; const grammarHtml = currentModalData.grammar ? `<div class="grammar-note">📐 Грамматика: ${currentModalData.grammar}</div>` : ""; document.getElementById("modalContent").innerHTML = `<div class="modal-emoji">${currentModalData.emoji || "📘"}</div><div class="modal-word">${currentModalData.word}</div><div class="detail-row"><div class="detail-label">📖 Пиньинь</div>${pinyinHtml}</div><div class="detail-row"><div class="detail-label">🇷🇺 Перевод</div>${transHtml}</div>${commentsHtml}${grammarHtml}<div class="modal-buttons"><button class="modal-btn" id="modalTogglePinyinBtn">🔊 Показать/скрыть пиньинь</button><button class="modal-btn" id="modalToggleTransBtn">🌐 Показать/скрыть перевод</button></div>`; document.getElementById("modalTogglePinyinBtn")?.addEventListener('click', (e) => { e.stopPropagation(); window.toggleModalPinyin(); }); document.getElementById("modalToggleTransBtn")?.addEventListener('click', (e) => { e.stopPropagation(); window.toggleModalTrans(); }); }
    window.toggleModalPinyin = function() { modalPinyinVisible = !modalPinyinVisible; updateModalContent(); }; window.toggleModalTrans = function() { modalTransVisible = !modalTransVisible; updateModalContent(); };
    function renderFilters() { const container = document.getElementById("categoryFilters"); const cats = ["all", "time", "action", "people", "places", "food", "question", "evaluation", "phrase", "grammar"]; container.innerHTML = cats.map(cat => { const display = cat === "all" ? "🏔️ Все категории" : categoryNames[cat]; const bg = cat === "all" ? "#5a6e4a" : categoryColors[cat]; return `<button class="cat-btn ${currentCategory === cat ? 'active' : ''}" style="background: ${bg};" data-cat="${cat}">${display}</button>`; }).join(''); document.querySelectorAll('.cat-btn').forEach(btn => { btn.addEventListener('click', () => { currentCategory = btn.dataset.cat; renderFilters(); renderBalls(); }); }); }
    document.getElementById("globalHidePinyinBtn").addEventListener('click', () => { globalPinyinVisible = false; if (currentModalData) { modalPinyinVisible = false; updateModalContent(); } }); document.getElementById("globalShowPinyinBtn").addEventListener('click', () => { globalPinyinVisible = true; if (currentModalData) { modalPinyinVisible = true; updateModalContent(); } }); document.getElementById("globalHideTransBtn").addEventListener('click', () => { globalTransVisible = false; if (currentModalData) { modalTransVisible = false; updateModalContent(); } }); document.getElementById("globalShowTransBtn").addEventListener('click', () => { globalTransVisible = true; if (currentModalData) { modalTransVisible = true; updateModalContent(); } }); document.getElementById("searchInput").addEventListener('input', (e) => { searchQuery = e.target.value; renderBalls(); }); document.getElementById("closeModalBtn").addEventListener('click', () => { document.getElementById("wordModal").classList.remove("active"); }); document.getElementById("wordModal").addEventListener('click', (e) => { if (e.target === document.getElementById("wordModal")) document.getElementById("wordModal").classList.remove("active"); });
    renderFilters(); renderBalls();
</script>
</body>
</html>
