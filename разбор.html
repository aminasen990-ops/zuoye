let knownWords = JSON.parse(localStorage.getItem('hsk6_known') || '[]');
let filterActive = false;

/* ============================================================
   РЕНДЕР ЛОГИЧЕСКИХ МАРКЕРОВ
   ============================================================ */
function renderLogicMarkers() {
  const grid = document.getElementById('logicGrid');
  if (!grid) return;
  grid.innerHTML = LOGIC_MARKERS.map(m => `
    <div class="logic-item">
      <span class="zh">${m.zh}</span>
      <span class="type">${m.type}</span>
      <div class="py">${m.py}</div>
      <div class="ru">${m.ru}</div>
    </div>
  `).join('');
}

/* ============================================================
   РЕНДЕР СЦЕН
   ============================================================ */
function renderScenes() {
  const container = document.getElementById('scenesContainer');
  if (!container) return;

  container.innerHTML = SCENES.map((scene, idx) => {
    const dialogueHtml = scene.dialogue.map(line => {
      let text = line.text.replace(/\{(.*?)\}/g, (match, word) => {
        const known = knownWords.includes(word) ? ' known-word' : '';
        return `<span class="word${known}" data-word="${word}">${word}</span>`;
      });
      return `<div><span class="speaker">${line.speaker}：</span>${text}</div>`;
    }).join('');

    const allWords = [];
    scene.dialogue.forEach(line => {
      const matches = line.text.matchAll(/\{(.*?)\}/g);
      for (const m of matches) allWords.push(m[1]);
    });
    const allKnown = allWords.length > 0 && allWords.every(w => knownWords.includes(w));

    return `
      <div class="scene${allKnown ? ' known' : ''}" data-scene-idx="${idx}">
        <div class="scene-title">${scene.title}</div>
        <div class="dialogue">${dialogueHtml}</div>
      </div>
    `;
  }).join('');

  document.querySelectorAll('.word').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = el.dataset.word;
      const data = WORDS[key];
      if (data) {
        openModal(key, data);
      } else {
        openModal(key, {
          pinyin: "—",
          trans: "нет данных в базе",
          keys: [],
          image: "",
          memory: "",
          curator: "",
          collocations: [],
          grammar: [],
          synonyms: [],
          examples: [],
          usage: "Это слово пока не добавлено в базу слов."
        });
      }
    });
  });

  updateCounter();
}

/* ============================================================
   СЧЁТЧИК
   ============================================================ */
function updateCounter() {
  const totalWords = Object.keys(WORDS).length;
  const knownCount = knownWords.filter(w => WORDS[w]).length;
  const counter = document.getElementById('counter');
  if (counter) counter.textContent = `Выучено: ${knownCount} / ${totalWords}`;
}

/* ============================================================
   МОДАЛЬНОЕ ОКНО
   ============================================================ */
function openModal(word, data) {
  const modal = document.getElementById('modal');
  const content = document.getElementById('modalContent');
  if (!modal || !content) return;

  let keysHtml = '';
  if (data.keys && data.keys.length > 0) {
    keysHtml = '<ul>' + data.keys.map(k => `<li><strong>${k.char}</strong> — ${k.meaning}</li>`).join('') + '</ul>';
  }

  let collocHtml = '';
  if (data.collocations && data.collocations.length > 0) {
    collocHtml = data.collocations.map(c => `
      <div class="colloc-item">
        <div class="zh">${c.zh}</div>
        <div class="py">${c.py}</div>
        <div class="ru">${c.ru}</div>
      </div>
    `).join('');
  }

  let grammarHtml = '';
  if (data.grammar && data.grammar.length > 0) {
    grammarHtml = '<ul>' + data.grammar.map(g => `<li><strong>${g.pattern}</strong><br><em>${g.py}</em><br>${g.ru}</li>`).join('') + '</ul>';
  }

  let synonymHtml = '';
  if (data.synonyms && data.synonyms.length > 0) {
    synonymHtml = '<ul>' + data.synonyms.map(s => `<li><strong>${s.word}</strong> (${s.py}) — ${s.diff}</li>`).join('') + '</ul>';
  }

  let exampleHtml = '';
  if (data.examples && data.examples.length > 0) {
    exampleHtml = data.examples.map(e => `
      <div class="example-item">
        <div class="zh">${e.zh}</div>
        <div class="py">${e.py}</div>
        <div class="ru">${e.ru}</div>
      </div>
    `).join('');
  }

  const isKnown = knownWords.includes(word);

  content.innerHTML = `
    <div class="modal-header">
      <div class="modal-word">${word}</div>
      <div class="modal-pinyin">${data.pinyin || ''}</div>
      <div class="modal-trans">${data.trans || ''}</div>
      <button class="speak-btn" onclick="speak('${word}')">🔊</button>
    </div>

    ${keysHtml ? `<div class="modal-section etym"><span class="label">🔍 Разбор ключей</span>${keysHtml}</div>` : ''}
    ${data.image ? `<div class="modal-section pic"><span class="label">🎨 Образ</span>${data.image}</div>` : ''}
    ${data.memory ? `<div class="turtle"><span class="label">🐢 Черепаший разбор</span><strong>${data.memory}</strong></div>` : ''}
    ${collocHtml ? `<div class="modal-section colloc"><span class="label">📚 Коллокации</span>${collocHtml}</div>` : ''}
    ${grammarHtml ? `<div class="modal-section grammar"><span class="label">🧩 Грамматика</span>${grammarHtml}</div>` : ''}
    ${synonymHtml ? `<div class="modal-section synonym"><span class="label">🔀 Синонимы</span>${synonymHtml}</div>` : ''}
    ${exampleHtml ? `<div class="modal-section example"><span class="label">💬 Примеры</span>${exampleHtml}</div>` : ''}
    ${data.usage ? `<div class="modal-section usage"><span class="label">📝 Употребление</span>${data.usage}</div>` : ''}
    ${data.curator ? `<div class="curator"><strong>👨‍🏫 Куратор:</strong> ${data.curator}</div>` : ''}

    <div class="know-buttons">
      <button class="btn ${isKnown ? 'active' : ''}" onclick="markKnown('${word}')">
        ${isKnown ? '✅ Выучено' : '✅ Знаю'}
      </button>
      <button class="btn danger" onclick="markUnknown('${word}')">❌ Не знаю</button>
    </div>
  `;

  modal.classList.add('active');
}

function closeModal() {
  const modal = document.getElementById('modal');
  if (modal) modal.classList.remove('active');
}

/* ============================================================
   АУДИО
   ============================================================ */
function speak(text) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.8;
    speechSynthesis.speak(utterance);
  }
}

/* ============================================================
   ИНТЕРВАЛЬНОЕ ПОВТОРЕНИЕ
   ============================================================ */
function markKnown(word) {
  if (!knownWords.includes(word)) {
    knownWords.push(word);
    localStorage.setItem('hsk6_known', JSON.stringify(knownWords));
  }
  closeModal();
  renderScenes();
  if (filterActive) applyFilter();
}

function markUnknown(word) {
  knownWords = knownWords.filter(w => w !== word);
  localStorage.setItem('hsk6_known', JSON.stringify(knownWords));
  closeModal();
  renderScenes();
  if (filterActive) applyFilter();
}

function resetKnown() {
  if (confirm('Сбросить весь прогресс?')) {
    knownWords = [];
    localStorage.setItem('hsk6_known', JSON.stringify(knownWords));
    renderScenes();
    if (filterActive) applyFilter();
  }
}

/* ============================================================
   ФИЛЬТР
   ============================================================ */
function toggleFilter() {
  filterActive = !filterActive;
  const btn = document.getElementById('filterBtn');
  if (btn) {
    btn.classList.toggle('active', filterActive);
    btn.textContent = filterActive ? '👁 Показать все' : '👁 Показать только невыученные';
  }
  applyFilter();
}

function applyFilter() {
  document.querySelectorAll('.scene').forEach(scene => {
    if (filterActive) {
      const words = scene.querySelectorAll('.word');
      const allKnown = Array.from(words).every(w => w.classList.contains('known-word'));
      scene.style.display = allKnown ? 'none' : '';
    } else {
      scene.style.display = '';
    }
  });
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  renderLogicMarkers();
  renderScenes();

  const modal = document.getElementById('modal');
  if (modal) {
    modal.addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
});
</script>
</body>
</html>
